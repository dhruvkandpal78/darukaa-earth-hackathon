# Every push and pull request must pass formatting, tests, and a production build.
name: Quality and deployment
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: darukaa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: darukaa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darukaa"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://darukaa:test-password@localhost:5432/darukaa_test
      JWT_SECRET: ci-only-test-secret-at-least-32-characters
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r backend/requirements.txt
      - run: npm run format:check
      - run: npm run lint
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: npm test
      - run: python -m pytest -q
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger the tested revision on Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          REVISION: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Configure RENDER_DEPLOY_HOOK before enabling production deployment."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK}&ref=${REVISION}"
